[project]
name = "ComfyUI_SmartLLM"
description = "Standalone Smart LM Loader, Smart Detection and bbox conversion, Registry Manager, verified model acquisition, and native or Docker LLM/VLM backends for ComfyUI."
version = "1.0.4"
license = {file = "LICENSE"}
dependencies = [
    "torch",
    "numpy",
    "Pillow",
    "opencv-python",
    "safetensors>=0.4,<0.9",
    "torchvision",
    "psutil",
    "requests",
    "aiohttp",
    "transformers>=4.51,<5.4",
    "huggingface_hub>=0.30,<2",
    "accelerate>=1,<2",
    "openai>=1,<2",
    "gguf>=0.6,<0.20",
]

[project.optional-dependencies]
sml = [
    "bitsandbytes>=0.45,<0.51",
    "llama-cpp-python>=0.3.16,<0.4",
    "onnxruntime>=1.21,<2",
    "ultralytics>=8.4.67,<8.5",
    "qwen-vl-utils>=0.0.14,<0.1",
    "peft>=0.18.1,<0.21",
]

[project.urls]
Repository = "https://github.com/r-vage/ComfyUI_SmartLLM"
Documentation = "https://github.com/r-vage/ComfyUI_SmartLLM/tree/main/Readme"

[tool.comfy]
PublisherId = "rvage"
DisplayName = "ComfyUI SmartLLM"
Icon = "https://raw.githubusercontent.com/r-vage/ComfyUI_SmartLLM/refs/heads/main/Readme/icon_eclipse.png"
